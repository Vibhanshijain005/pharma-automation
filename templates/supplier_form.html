{% extends 'base.html' %}
{% block content %}
<div class="mb-4">
  <h3><i class="fas fa-edit me-2 text-teal"></i>Edit Supplier</h3>
  <p class="text-muted">Update supplier information</p>
</div>

<div class="card p-4">
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input name="name" class="form-control" value="{{ supplier.name }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input name="email" class="form-control" value="{{ supplier.email }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Phone</label>
      <input name="phone" class="form-control" value="{{ supplier.phone }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Address</label>
      <input name="address" class="form-control" value="{{ supplier.address }}">
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-teal" type="submit">Save</button>
      <a class="btn btn-outline-secondary" href="/suppliers">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
