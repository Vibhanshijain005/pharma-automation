{% extends 'base.html' %}
{% block content %}
<div class="mb-4">
  <h3><i class="fas fa-cog me-2 text-teal"></i>System Settings</h3>
  <p class="text-muted">Configure your pharmacy preferences</p>
</div>

<div class="row g-4">
  <div class="col-md-6">
    <div class="card p-4">
      <h5><i class="fas fa-gear me-2"></i>General</h5>
      <hr>
        <form method="post" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label">Pharmacy Name</label>
            <input name="pharmacy_name" type="text" class="form-control" value="PharmaCare">
          </div>
          <div class="mb-3">
            <label class="form-label">Contact Email</label>
            <input name="contact_email" type="email" class="form-control" placeholder="pharmacy@example.com">
          </div>
          <div class="mb-3">
            <label class="form-label">Logo</label>
            <input name="logo" type="file" accept="image/*" class="form-control">
            {% if logo %}
              <div class="mt-2">
                <img src="/{{ logo }}" alt="logo" style="height:60px; object-fit:contain; border-radius:6px;">
              </div>
            {% endif %}
          </div>
          <button class="btn btn-teal"><i class="fas fa-save me-2"></i>Save</button>
        </form>
    </div>
  </div>

  <div class="col-md-6">
    <div class="card p-4">
      <h5><i class="fas fa-lock me-2"></i>Security</h5>
      <hr>
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm</label>
        <input type="password" class="form-control">
      </div>
      <button class="btn btn-outline-secondary"><i class="fas fa-key me-2"></i>Change</button>
    </div>
  </div>
</div>
{% endblock %}
