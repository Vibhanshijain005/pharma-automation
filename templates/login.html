{% extends 'base.html' %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #FFFEF9 0%, #FAF4EC 100%);">
  <div class="row w-100 justify-content-center">
    <div class="col-md-5">
      <div class="card p-5 border-0 shadow-lg" style="border-top: 4px solid #2c7873;">
        <div class="text-center mb-4">
          <div class="display-6 text-teal mb-2">
            <i class="fas fa-pills"></i>
          </div>
          <h2 class="fw-bold text-teal">PharmaCare</h2>
          <p class="text-muted">Pharmacy Management System</p>
        </div>

        <form method="post" class="needs-validation">
          <div class="mb-4">
            <label class="form-label fw-bold">Email Address</label>
            <input class="form-control form-control-lg" name="email" type="email" placeholder="Enter your email" required>
            <small class="text-muted">Use your registered email</small>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold">Password</label>
            <input class="form-control form-control-lg" name="password" type="password" placeholder="Enter password" required>
            <small class="text-muted">Case sensitive</small>
          </div>

          <div class="mb-4 form-check">
            <input class="form-check-input" name="remember" type="checkbox" id="remember">
            <label class="form-check-label" for="remember">Remember me</label>
          </div>

          <button class="btn btn-teal btn-lg w-100 fw-bold" type="submit">
            <i class="fas fa-sign-in-alt me-2"></i>Sign In
          </button>

          <hr class="my-4">

          <p class="text-center text-muted mb-0">
            Don't have an account? 
            <a href="/register" class="text-teal fw-bold">Register Here</a>
          </p>
        </form>
      </div>

      <div class="mt-3 text-center text-muted small">
        <p><i class="fas fa-lock me-1"></i>Your password is secure and encrypted</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
