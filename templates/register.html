{% extends 'base.html' %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #FAF4EC 0%, #FFFEF9 100%);">
  <div class="row w-100 justify-content-center">
    <div class="col-md-6">
      <div class="card p-5 border-0 shadow-lg" style="border-top: 4px solid #2c7873;">
        <div class="text-center mb-4">
          <div class="display-6 text-teal mb-2">
            <i class="fas fa-user-plus"></i>
          </div>
          <h2 class="fw-bold text-teal">Create Account</h2>
          <p class="text-muted">Join PharmaCare Pharmacy System</p>
        </div>

        <form method="post">
          <div class="row">
            <div class="col-md-12 mb-3">
              <label class="form-label fw-bold">Full Name *</label>
              <input class="form-control form-control-lg" name="name" placeholder="Enter your full name" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Email Address *</label>
            <input class="form-control form-control-lg" name="email" type="email" placeholder="Enter email address" required>
            <small class="text-muted">We'll use this for login</small>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Password *</label>
            <input class="form-control form-control-lg" name="password" type="password" placeholder="Create a strong password" required>
            <small class="text-muted">Min. 6 characters</small>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold">Account Type *</label>
            <select name="role" class="form-select form-select-lg" required>
              <option value="">-- Select Role --</option>
              <option value="customer">Customer</option>
              <option value="pharmacist">Pharmacist</option>
              <option value="admin">Administrator</option>
            </select>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="agree" required>
            <label class="form-check-label" for="agree">
              I agree to the Terms and Conditions
            </label>
          </div>

          <button class="btn btn-teal btn-lg w-100 fw-bold" type="submit">
            <i class="fas fa-check me-2"></i>Register Account
          </button>

          <hr class="my-4">

          <p class="text-center text-muted">
            Already have an account? 
            <a href="/login" class="text-teal fw-bold">Sign In Here</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
