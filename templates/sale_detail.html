{% extends 'base.html' %}
{% block content %}
<div class="mb-4">
  <h3><i class="fas fa-receipt me-2 text-teal"></i>Invoice #{{ sale.id }}</h3>
  <p class="text-muted">Details for this transaction</p>
</div>

<div class="card p-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h5 class="mb-1">Customer: <strong>{{ sale.customer_name }}</strong></h5>
      <small class="text-muted">Date: {{ sale.date.strftime('%d %b %Y, %H:%M') }}</small>
    </div>
    <div class="text-end">
      <a class="btn btn-primary me-2" href="/sale/{{ sale.id }}/invoice"><i class="fas fa-file-pdf me-2"></i>Download PDF</a>
      <a class="btn btn-outline-secondary" href="/billing"><i class="fas fa-arrow-left me-2"></i>New Billing</a>
    </div>
  </div>

  <div class="row">
    <div class="col-md-6">
      <div class="p-3 bg-light rounded">
        <h6 class="text-muted">Total Amount</h6>
        <h2 class="text-teal">PKR {{ '%.2f'|format(sale.total) }}</h2>
      </div>
    </div>
    <div class="col-md-6">
      <div class="p-3">
        <h6 class="text-muted">Status</h6>
        <span class="badge bg-success">Completed</span>
      </div>
    </div>
  </div>
</div>

<script>
  // show a toast-like notification on page load
  document.addEventListener('DOMContentLoaded', function() {
    if (window.showNotification) {
      window.showNotification('Invoice created — PKR {{ "%.2f"|format(sale.total) }}', 'success');
    }
  });
</script>
{% endblock %}
